services:
  # ============================================================
  # 1. FASTAPI BACKEND WEB SERVICE
  # ============================================================
  - type: web
    name: aicte-compliance-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: CORS_ORIGINS
        value: "*"

  # ============================================================
  # 2. REACT + VITE FRONTEND STATIC SITE
  # ============================================================
  - type: web
    name: aicte-compliance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aicte-compliance-backend
          property: host
